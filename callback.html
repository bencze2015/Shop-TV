<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WHOOP Authorization</title><style>body{margin:0;min-height:100vh;background:#0b0b0b;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:32px}.card{max-width:760px;width:100%;border:1px solid #333;border-radius:16px;padding:32px}.muted{color:#aaa}.error{color:#ff9a9a}.success{color:#9dffb0}</style></head><body><div class="card"><h1 id="title">WHOOP authorization received</h1><p id="message">Checking the OAuth response…</p><div id="details" class="muted"></div></div><script>const p=new URLSearchParams(location.search),code=p.get('code'),state=p.get('state'),error=p.get('error'),desc=p.get('error_description'),title=document.getElementById('title'),message=document.getElementById('message'),details=document.getElementById('details');async function run(){if(error){title.textContent='WHOOP authorization failed';message.className='error';message.textContent=desc||error;return}if(!code||!state){title.textContent='WHOOP callback is ready';message.textContent='No complete authorization response is present. Start the WHOOP connection from the dashboard.';return}title.textContent='Finishing WHOOP connection…';message.textContent='Exchanging the authorization code and saving the connection securely on the server.';try{const r=await fetch('/api/whoop-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,state})}),d=await r.json();if(!r.ok)throw new Error(d?.details?.error_description||d?.details?.error||d?.details||d?.error||'Token exchange failed');const name=d.profile==='kelsey'?'Kelsey':'Jordan';title.textContent=name+' WHOOP connected';message.className='success';message.textContent=name+' WHOOP is now stored securely on the server. The TV will update automatically.';details.textContent='You can close this page and return to the dashboard.'}catch(e){title.textContent='WHOOP token exchange failed';message.className='error';message.textContent=e.message||String(e);details.textContent='Start the WHOOP connection again from the dashboard. If the problem continues, check the server configuration.'}}run();</script></body></html>
