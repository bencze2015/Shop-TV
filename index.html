<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop TV Workout</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090a0b;color:#f7f7f5;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{min-height:100vh;padding:clamp(34px,5vw,78px)}button{font:inherit}.screen{width:min(1420px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}.eyebrow{font-size:clamp(12px,.85vw,15px);font-weight:750;letter-spacing:.19em;color:#777;text-transform:uppercase;margin-bottom:10px}.hello{font-size:clamp(30px,3vw,48px);line-height:1;font-weight:760;letter-spacing:.075em}.date{font-size:clamp(18px,1.8vw,30px);font-weight:500;color:#8b8d90;margin-top:10px}.rightTop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}.live{display:flex;align-items:center;gap:9px;color:#8b8d90;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.dot{width:7px;height:7px;border-radius:50%;background:#67d391}.nav,.profiles{display:flex;gap:6px}.nav button,.profiles button{border:1px solid #282b2e;background:#111315;color:#8c9094;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:750;letter-spacing:.08em;cursor:pointer}.nav button.active,.profiles button.active{background:#f3f3f0;color:#111}.whoop{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:38px 0 0}.metric,.panel{background:#101214;border:1px solid #24272a;border-radius:15px;padding:20px 22px}.metric{min-height:112px}.metric span,.panel-label,.workout-label{display:block;color:#777b7f;font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.12em}.metric b{display:block;font-size:clamp(28px,2.5vw,42px);line-height:1;margin-top:13px;letter-spacing:-.035em}.trend{margin-top:9px;color:#74787c;font-size:12px;font-weight:650}.trend.up{color:#70c993}.trend.down{color:#d68a8a}.status{color:#8b8d90;margin:32px 0}.connect{background:#f4f4f2;color:#111;border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:750;cursor:pointer;margin-top:10px}.divider{height:1px;background:linear-gradient(90deg,#292c2f,transparent);margin:44px 0 0}.workout-wrap{padding-top:38px}.title,.rest{font-size:clamp(62px,8.5vw,128px);line-height:.92;font-weight:800;letter-spacing:-.055em;margin:12px 0 0}.rest-sub{color:#6f7275;font-size:clamp(16px,1.25vw,21px);margin-top:20px}.idle-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px;margin-top:34px;max-width:1000px}.panel-value{font-size:clamp(24px,2.5vw,38px);font-weight:720;margin-top:8px}.panel-sub{color:#707478;margin-top:5px;font-size:14px}.exercise-list{display:grid;gap:10px;margin-top:28px;max-width:1100px}.exercise{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:16px;background:#101214;border:1px solid #24272a;border-radius:14px;padding:18px 20px;cursor:pointer}.exercise.selected{border-color:#666b70;box-shadow:0 0 0 1px #3b3f43}.exercise-num{color:#5e6266;font-size:14px;font-weight:750}.exercise-name{font-size:clamp(22px,2.1vw,34px);font-weight:650}.exercise-meta{color:#777b7f;margin-top:5px;font-size:14px}.set-count{font-size:clamp(22px,2vw,32px);font-weight:750}.set-count.done{color:#72cf95}.controls{display:flex;align-items:center;gap:12px;margin-top:20px;color:#6f7377;font-size:13px}.kbd{border:1px solid #363a3e;border-radius:6px;padding:4px 7px;color:#a7aaad}.progress-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}.progress-big{font-size:clamp(38px,4.2vw,66px);font-weight:780;letter-spacing:-.04em;margin-top:12px}.bar{height:7px;background:#202326;border-radius:8px;overflow:hidden;margin-top:14px}.bar i{display:block;height:100%;background:#e9e9e6}.history{margin-top:24px;display:grid;gap:9px;max-width:1000px}.history-row{display:flex;justify-content:space-between;background:#101214;border:1px solid #232629;border-radius:12px;padding:14px 17px;color:#a8abad}.dev{position:fixed;right:18px;bottom:18px;display:flex;gap:7px;opacity:.12}.dev:hover{opacity:1}.dev button{background:#151719;color:#aaa;border:1px solid #303336;border-radius:8px;padding:9px 12px}.preview{position:fixed;right:22px;top:18px;color:#777;font-size:12px;font-weight:700;letter-spacing:.12em}@media(max-width:900px){.whoop{grid-template-columns:repeat(2,1fr)}.whoop .metric:last-child{grid-column:span 2}.top{display:block}.rightTop{margin-top:18px;justify-content:flex-start}.idle-grid,.progress-grid{grid-template-columns:1fr}}</style></head>
<body><main class="screen"><div class="top"><div><div class="eyebrow" id="programName">Shop Training</div><div class="hello" id="hello">HELLO</div><div class="date" id="date"></div></div><div class="rightTop"><div class="profiles"><button id="jordanBtn" onclick="setProfile('jordan')">JORDAN</button><button id="kelseyBtn" onclick="setProfile('kelsey')">KELSEY</button></div><div class="live"><i class="dot"></i><span id="whoopLive">WHOOP LIVE</span></div><div class="nav"><button id="todayTab" class="active" onclick="setView('today')">TODAY</button><button id="progressTab" onclick="setView('progress')">PROGRESS</button></div></div></div><div id="whoop" class="status">Loading WHOOP…</div><div class="divider"></div><div class="workout-wrap" id="content"></div></main><div class="preview" id="preview"></div><div class="dev"><button onclick="changeDay(-1)">◀ Day</button><button onclick="useToday()">Today</button><button onclick="changeDay(1)">Day ▶</button></div>
<script>
const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],realNow=new Date();let selectedDay=new URLSearchParams(location.search).get('day');if(!days.includes(selectedDay))selectedDay=days[realNow.getDay()];let data={profiles:{}},profileId=localStorage.getItem('shopProfile')||'jordan',profile={name:'Jordan',week:{}},whoopData=null,view='today',selectedExercise=0;const WHOOP_AUTH='https://api.prod.whoop.com/oauth/oauth2/auth?response_type=code&client_id=0ed05800-a149-484d-a547-37c6aebe86e1&redirect_uri=https%3A%2F%2Fshop-tv-gamma.vercel.app%2Fcallback.html&scope=offline%20read%3Arecovery%20read%3Acycles%20read%3Asleep%20read%3Aworkout%20read%3Aprofile&state=shoptv123456';
const todayKey=()=>realNow.toISOString().slice(0,10),stateKey=()=>`shopWorkout:${profileId}:${todayKey()}`,historyKey=()=>`shopHistory:${profileId}`;function loadState(){try{return JSON.parse(localStorage.getItem(stateKey()))||{sets:{},completed:false}}catch{return {sets:{},completed:false}}function saveState(s){localStorage.setItem(stateKey(),JSON.stringify(s));if(s.completed){let h=[];try{h=JSON.parse(localStorage.getItem(historyKey()))||[]}catch{};if(!h.some(x=>x.date===todayKey())){const p=planFor(days[realNow.getDay()]);h.unshift({date:todayKey(),name:p.name});localStorage.setItem(historyKey(),JSON.stringify(h.slice(0,60)))}}renderContent()}
function planFor(day){return profile.week?.[day]||{name:'Rest',exercises:[]}}function nextWorkout(){const start=days.indexOf(selectedDay);for(let n=1;n<=7;n++){const d=days[(start+n)%7],p=planFor(d);if(p.exercises?.length)return{day:d,name:p.name}}return null}function weekStats(){let h=[];try{h=JSON.parse(localStorage.getItem(historyKey()))||[]}catch{};const now=new Date(),mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));mon.setHours(0,0,0,0);let scheduled=0,completed=0;for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);if(planFor(days[d.getDay()]).exercises?.length){scheduled++;if(h.some(x=>x.date===d.toISOString().slice(0,10)))completed++}}return{scheduled,completed}}
function setProfile(id){if(!data.profiles[id])return;profileId=id;profile=data.profiles[id];localStorage.setItem('shopProfile',id);selectedExercise=0;whoopData=null;renderAll();loadWhoop()}function renderHeader(){hello.textContent='HELLO, '+profile.name.toUpperCase();programName.textContent=(data.programName||'Shop Training')+' · '+(planFor(selectedDay).name||'Rest');jordanBtn.classList.toggle('active',profileId==='jordan');kelseyBtn.classList.toggle('active',profileId==='kelsey');const isToday=selectedDay===days[realNow.getDay()];date.textContent=isToday?realNow.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}):selectedDay+' — PREVIEW';preview.textContent=isToday?'':'TEST MODE'}
function renderContent(){renderHeader();todayTab.classList.toggle('active',view==='today');progressTab.classList.toggle('active',view==='progress');if(view==='progress')return renderProgress();const p=planFor(selectedDay),items=p.exercises||[];if(!items.length){const n=nextWorkout(),w=weekStats(),pct=w.scheduled?Math.round(w.completed/w.scheduled*100):100;content.innerHTML=`<div class="workout-label">Today’s Plan</div><div class="rest">REST DAY</div><div class="rest-sub">Recover. Reset. Come back ready.</div><div class="idle-grid"><div class="panel"><div class="panel-label">Next Workout</div><div class="panel-value">${n?n.day+' · '+n.name:'None'}</div></div><div class="panel"><div class="panel-label">This Week</div><div class="panel-value">${w.completed}/${w.scheduled}</div><div class="bar"><i style="width:${pct}%"></i></div></div></div>`;return}const s=loadState();content.innerHTML=`<div class="workout-label">${p.name}</div><div class="title">TRAINING DAY</div><div class="exercise-list">${items.map((x,i)=>{const done=Math.min(s.sets[x.id]||0,x.sets);return`<div class="exercise ${i===selectedExercise?'selected':''}" onclick="selectedExercise=${i};renderContent()"><span class="exercise-num">${String(i+1).padStart(2,'0')}</span><div><div class="exercise-name">${x.name}</div><div class="exercise-meta">${x.sets} × ${x.reps} · ${x.restSeconds}s rest</div></div><div class="set-count ${done>=x.sets?'done':''}">${done}/${x.sets}</div></div>`}).join('')}</div><div class="controls"><span class="kbd">↑ ↓</span> Select <span class="kbd">ENTER</span> Complete set</div>`}
function completeSet(){if(view!=='today')return;const p=planFor(selectedDay),x=p.exercises?.[selectedExercise];if(!x)return;const s=loadState();s.sets[x.id]=Math.min((s.sets[x.id]||0)+1,x.sets);s.completed=p.exercises.every(e=>(s.sets[e.id]||0)>=e.sets);saveState(s)}function renderProgress(){const w=weekStats(),pct=w.scheduled?Math.round(w.completed/w.scheduled*100):100;let h=[];try{h=JSON.parse(localStorage.getItem(historyKey()))||[]}catch{};const t=whoopData?.trends||{};content.innerHTML=`<div class="workout-label">${profile.name} · Training Overview</div><div class="title">PROGRESS</div><div class="progress-grid"><div class="panel"><div class="panel-label">Weekly Completion</div><div class="progress-big">${pct}%</div><div class="bar"><i style="width:${pct}%"></i></div></div><div class="panel"><div class="panel-label">HRV vs Baseline</div><div class="progress-big">${trendPct(t.hrv)}</div></div><div class="panel"><div class="panel-label">Recovery vs Baseline</div><div class="progress-big">${trendPct(t.recovery)}</div></div></div><div class="history">${h.length?h.slice(0,6).map(x=>`<div class="history-row"><strong>${x.name}</strong><span>${x.date}</span></div>`).join(''):'<div class="panel-sub">Complete a workout to build history.</div>'}</div>`}function trendPct(x){if(!Number.isFinite(x?.current)||!Number.isFinite(x?.baseline)||!x.baseline)return'—';const p=(x.current-x.baseline)/x.baseline*100;return`${p>=0?'+':''}${Math.round(p)}%`}
function metric(l,v,t,type){let extra='';if(t&&Number.isFinite(t.current)&&Number.isFinite(t.baseline)){const d=t.current-t.baseline,good=type==='rhr'?d<=0:d>=0;extra=`<div class="trend ${good?'up':'down'}">${d>=0?'↑':'↓'} ${Math.abs(Math.round(d))} vs avg</div>`}return`<div class="metric"><span>${l}</span><b>${v??'—'}</b>${extra}</div>`}async function loadWhoop(){if(profileId==='kelsey'){whoop.className='status';whoop.innerHTML='Kelsey WHOOP is not connected yet. Her workout tracking works independently.';whoopLive.textContent='WHOOP NOT CONNECTED';return}try{const r=await fetch('/api/whoop-data'),d=await r.json();if(!r.ok)throw new Error(d.error||'WHOOP request failed');whoopData=d;const rec=d.recovery?.score||{},cy=d.cycle?.score||{},sl=d.sleep?.score||{},t=d.trends||{};whoop.className='whoop';whoop.innerHTML=metric('Recovery',rec.recovery_score!=null?rec.recovery_score+'%':'—',t.recovery)+metric('HRV',rec.hrv_rmssd_milli!=null?Math.round(rec.hrv_rmssd_milli)+' ms':'—',t.hrv)+metric('Resting HR',rec.resting_heart_rate!=null?rec.resting_heart_rate+' bpm':'—',t.rhr,'rhr')+metric('Day Strain',cy.strain!=null?cy.strain.toFixed(1):'—',t.strain)+metric('Sleep',sl.sleep_performance_percentage!=null?sl.sleep_performance_percentage+'%':'—',t.sleep);whoopLive.textContent='WHOOP LIVE';if(view==='progress')renderContent()}catch(e){whoop.className='status';whoop.innerHTML=e.message.includes('not connected')?`WHOOP needs to be connected.<br><button class="connect" onclick="location.href=WHOOP_AUTH">Connect WHOOP</button>`:'WHOOP data unavailable: '+e.message}}
function setView(v){view=v;renderContent()}function setDay(d){selectedDay=d;selectedExercise=0;const u=new URL(location.href);u.searchParams.set('day',d);history.replaceState({},'',u);renderContent()}function changeDay(n){let i=days.indexOf(selectedDay);setDay(days[(i+n+7)%7])}function useToday(){selectedDay=days[realNow.getDay()];const u=new URL(location.href);u.searchParams.delete('day');history.replaceState({},'',u);renderContent()}function renderAll(){renderContent()}document.addEventListener('keydown',e=>{if(view!=='today')return;const items=planFor(selectedDay).exercises||[];if(e.key==='ArrowDown'){e.preventDefault();selectedExercise=Math.min(selectedExercise+1,items.length-1);renderContent()}if(e.key==='ArrowUp'){e.preventDefault();selectedExercise=Math.max(selectedExercise-1,0);renderContent()}if(e.key==='Enter'){e.preventDefault();completeSet()}});async function init(){try{data=await fetch('/workouts.json',{cache:'no-store'}).then(r=>r.json());if(!data.profiles[profileId])profileId='jordan';profile=data.profiles[profileId];renderAll();loadWhoop();setInterval(loadWhoop,15*60*1000)}catch(e){content.textContent='Workout program unavailable: '+e.message}}init();
</script></body></html>
