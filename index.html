<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop TV Workout</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0b0b;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif;padding:5vw}.screen{width:min(1400px,100%);margin:auto}.hello{font-size:clamp(24px,3vw,52px);font-weight:700;letter-spacing:.08em}.date{font-size:clamp(20px,2.4vw,40px);color:#aaa;margin-top:10px}.whoop{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:14px;margin:32px 0}.metric{border:1px solid #333;border-radius:14px;padding:18px}.metric b{display:block;font-size:clamp(26px,3vw,48px);margin-top:7px}.metric span{color:#999;font-size:14px;text-transform:uppercase;letter-spacing:.08em}.status{color:#888;margin:18px 0}.title{font-size:clamp(42px,7vw,110px);font-weight:800;margin:5vh 0 3vh}.exercise{font-size:clamp(28px,4vw,64px);padding:18px 0;border-bottom:1px solid #333}.rest{font-size:clamp(60px,10vw,150px);font-weight:800;margin-top:6vh}.dev{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;opacity:.28}.dev:hover{opacity:1}.dev button{background:#222;color:#ddd;border:1px solid #555;border-radius:8px;padding:10px 14px;cursor:pointer}.preview{position:fixed;right:18px;top:18px;color:#888}@media(max-width:800px){.whoop{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><main class="screen"><div class="hello">HELLO, JORDAN</div><div class="date" id="date"></div><div id="whoop" class="status">Loading WHOOP…</div><div id="workout"></div></main><div class="preview" id="preview"></div><div class="dev"><button onclick="changeDay(-1)">◀ Day</button><button onclick="useToday()">Today</button><button onclick="changeDay(1)">Day ▶</button></div>
<script>
const workouts={Monday:["Dumbbell Press — 3 × 10","Dumbbell Incline Press — 3 × 10"],Tuesday:[],Wednesday:[],Thursday:[],Friday:[],Saturday:[],Sunday:[]},days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],realNow=new Date();let selectedDay=new URLSearchParams(location.search).get("day");if(!days.includes(selectedDay))selectedDay=days[realNow.getDay()];
function render(){const isToday=selectedDay===days[realNow.getDay()];date.textContent=isToday?realNow.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"}):selectedDay+" — PREVIEW";preview.textContent=isToday?"":"TEST MODE";const items=workouts[selectedDay]||[];workout.innerHTML=items.length?'<div class="title">TODAY’S WORKOUT</div>'+items.map(x=>'<div class="exercise">'+x+'</div>').join(''):'<div class="rest">REST DAY</div>'}
function setDay(day){selectedDay=day;const u=new URL(location.href);u.searchParams.set("day",day);history.replaceState({},"",u);render()}function changeDay(d){let i=days.indexOf(selectedDay);setDay(days[(i+d+7)%7])}function useToday(){selectedDay=days[realNow.getDay()];const u=new URL(location.href);u.searchParams.delete("day");history.replaceState({},"",u);render()}
function metric(label,value){return `<div class="metric"><span>${label}</span><b>${value??'—'}</b></div>`}async function loadWhoop(){try{const r=await fetch('/api/whoop-data'),d=await r.json();if(!r.ok)throw new Error(d.error||'WHOOP request failed');const rec=d.recovery?.score||{},cy=d.cycle?.score||{},sl=d.sleep?.score||{};whoop.className='whoop';whoop.innerHTML=metric('Recovery',rec.recovery_score!=null?rec.recovery_score+'%':'—')+metric('HRV',rec.hrv_rmssd_milli!=null?Math.round(rec.hrv_rmssd_milli)+' ms':'—')+metric('Resting HR',rec.resting_heart_rate!=null?rec.resting_heart_rate+' bpm':'—')+metric('Day Strain',cy.strain!=null?cy.strain.toFixed(1):'—')+metric('Sleep',sl.sleep_performance_percentage!=null?sl.sleep_performance_percentage+'%':'—')}catch(e){whoop.className='status';whoop.textContent=e.message.includes('not connected')?'WHOOP needs to be connected once in this browser.':'WHOOP data unavailable: '+e.message}}
render();loadWhoop();
</script></body></html>
