<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop TV Workout</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090a0b;color:#f7f7f5;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{min-height:100vh;padding:clamp(34px,5vw,78px)}.screen{width:min(1420px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}.eyebrow{font-size:clamp(12px,.85vw,15px);font-weight:750;letter-spacing:.19em;color:#777;text-transform:uppercase;margin-bottom:10px}.hello{font-size:clamp(30px,3vw,48px);line-height:1;font-weight:760;letter-spacing:.075em}.date{font-size:clamp(18px,1.8vw,30px);font-weight:500;color:#8b8d90;margin-top:10px}.live{display:flex;align-items:center;gap:9px;color:#8b8d90;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-top:7px}.dot{width:7px;height:7px;border-radius:50%;background:#67d391;box-shadow:0 0 14px rgba(103,211,145,.45)}.whoop{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:38px 0 0}.metric{position:relative;background:linear-gradient(180deg,#111315,#0d0f10);border:1px solid #26292c;border-radius:16px;padding:18px 20px 20px;min-height:106px;box-shadow:0 10px 30px rgba(0,0,0,.16)}.metric span{display:block;color:#777b7f;font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.12em}.metric b{display:block;font-size:clamp(28px,2.5vw,42px);line-height:1;margin-top:13px;letter-spacing:-.035em;font-variant-numeric:tabular-nums}.status{color:#8b8d90;margin:32px 0}.connect{display:inline-block;margin-top:12px;background:#f4f4f2;color:#111;border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:750;cursor:pointer}.divider{height:1px;background:linear-gradient(90deg,#292c2f,transparent);margin:44px 0 0}.workout-wrap{padding-top:38px}.workout-label{color:#777b7f;font-size:13px;font-weight:750;letter-spacing:.16em;text-transform:uppercase;margin-bottom:12px}.title,.rest{font-size:clamp(62px,8.5vw,128px);line-height:.92;font-weight:800;letter-spacing:-.055em;margin:0}.rest-sub{color:#6f7275;font-size:clamp(16px,1.25vw,21px);margin-top:20px}.exercise-list{display:grid;gap:10px;margin-top:28px;max-width:1100px}.exercise{display:flex;align-items:center;gap:18px;background:#101214;border:1px solid #24272a;border-radius:14px;padding:20px 22px;font-size:clamp(23px,2.4vw,38px);font-weight:600}.exercise-num{color:#5e6266;font-size:15px;font-weight:750;min-width:26px}.dev{position:fixed;right:18px;bottom:18px;display:flex;gap:7px;opacity:.14;transition:opacity .2s}.dev:hover{opacity:1}.dev button{background:#151719;color:#aaa;border:1px solid #303336;border-radius:8px;padding:9px 12px;cursor:pointer}.preview{position:fixed;right:22px;top:18px;color:#777;font-size:12px;font-weight:700;letter-spacing:.12em}@media(max-width:900px){.whoop{grid-template-columns:repeat(2,1fr)}.whoop .metric:last-child{grid-column:span 2}.top{display:block}.live{margin-top:18px}}@media(max-width:520px){body{padding:28px 20px}.whoop{grid-template-columns:1fr 1fr;gap:8px}.metric{padding:15px;min-height:92px}.divider{margin-top:30px}.workout-wrap{padding-top:30px}}
</style></head>
<body><main class="screen"><div class="top"><div><div class="eyebrow">Daily Training</div><div class="hello">HELLO, JORDAN</div><div class="date" id="date"></div></div><div class="live"><i class="dot"></i>WHOOP LIVE</div></div><div id="whoop" class="status">Loading WHOOP…</div><div class="divider"></div><div class="workout-wrap" id="workout"></div></main><div class="preview" id="preview"></div><div class="dev"><button onclick="changeDay(-1)">◀ Day</button><button onclick="useToday()">Today</button><button onclick="changeDay(1)">Day ▶</button></div>
<script>
const workouts={Monday:["Dumbbell Press — 3 × 10","Dumbbell Incline Press — 3 × 10"],Tuesday:[],Wednesday:[],Thursday:[],Friday:[],Saturday:[],Sunday:[]},days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],realNow=new Date();let selectedDay=new URLSearchParams(location.search).get("day");if(!days.includes(selectedDay))selectedDay=days[realNow.getDay()];
const WHOOP_AUTH='https://api.prod.whoop.com/oauth/oauth2/auth?response_type=code&client_id=0ed05800-a149-484d-a547-37c6aebe86e1&redirect_uri=https%3A%2F%2Fshop-tv-gamma.vercel.app%2Fcallback.html&scope=offline%20read%3Arecovery%20read%3Acycles%20read%3Asleep%20read%3Aworkout%20read%3Aprofile&state=shoptv123456';
function render(){const isToday=selectedDay===days[realNow.getDay()];date.textContent=isToday?realNow.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"}):selectedDay+' — PREVIEW';preview.textContent=isToday?'':'TEST MODE';const items=workouts[selectedDay]||[];workout.innerHTML=items.length?'<div class="workout-label">Today’s Workout</div><div class="title">TRAINING DAY</div><div class="exercise-list">'+items.map((x,i)=>'<div class="exercise"><span class="exercise-num">'+String(i+1).padStart(2,'0')+'</span><span>'+x+'</span></div>').join('')+'</div>':'<div class="workout-label">Today’s Plan</div><div class="rest">REST DAY</div><div class="rest-sub">Recover. Reset. Come back ready.</div>'}
function setDay(day){selectedDay=day;const u=new URL(location.href);u.searchParams.set('day',day);history.replaceState({},'',u);render()}function changeDay(d){let i=days.indexOf(selectedDay);setDay(days[(i+d+7)%7])}function useToday(){selectedDay=days[realNow.getDay()];const u=new URL(location.href);u.searchParams.delete('day');history.replaceState({},'',u);render()}
function metric(label,value){return `<div class="metric"><span>${label}</span><b>${value??'—'}</b></div>`}async function loadWhoop(){try{const r=await fetch('/api/whoop-data'),d=await r.json();if(!r.ok)throw new Error(d.error||'WHOOP request failed');const rec=d.recovery?.score||{},cy=d.cycle?.score||{},sl=d.sleep?.score||{};whoop.className='whoop';whoop.innerHTML=metric('Recovery',rec.recovery_score!=null?rec.recovery_score+'%':'—')+metric('HRV',rec.hrv_rmssd_milli!=null?Math.round(rec.hrv_rmssd_milli)+' ms':'—')+metric('Resting HR',rec.resting_heart_rate!=null?rec.resting_heart_rate+' bpm':'—')+metric('Day Strain',cy.strain!=null?cy.strain.toFixed(1):'—')+metric('Sleep',sl.sleep_performance_percentage!=null?sl.sleep_performance_percentage+'%':'—')}catch(e){whoop.className='status';if(e.message.includes('not connected')){whoop.innerHTML='WHOOP needs to be connected once in this browser.<br><button class="connect" onclick="location.href=WHOOP_AUTH">Connect WHOOP</button>'}else{whoop.textContent='WHOOP data unavailable: '+e.message}}}
render();loadWhoop();
</script></body></html>
