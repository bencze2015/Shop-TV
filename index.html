<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080a0c">
  <title>Shop TV Training</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#080a0c;color:#f5f7f4;font-family:Arial,"Helvetica Neue",sans-serif}
    body{height:100vh;min-height:560px;padding:28px 38px;background:#080a0c;background:radial-gradient(circle at 82% -10%,#17201c 0,#0d1111 30%,#080a0c 62%)}
    button{font:inherit}
    .screen{width:100%;height:100%;min-height:0;display:flex;flex-direction:column}
    .topbar{flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between}
    .identity{min-width:330px}
    .kicker,.view-label,.metric-label,.card-label,.queue-label{color:#7c8581;font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
    .kicker strong{color:#a9ffcf}
    .welcome{margin-top:7px;font-size:34px;font-weight:760;letter-spacing:.045em;line-height:1}
    .dayline{margin-top:7px;color:#a5ada9;font-size:15px;font-weight:600}
    .toolbar{display:flex;align-items:center;justify-content:flex-end;padding-top:2px}
    .household{display:flex;align-items:center;margin-right:14px;padding:4px;border:1px solid #222a27;border-radius:11px;background:#0b0f0e}
    .household-label{padding:0 8px;color:#66706b;font-size:8px;font-weight:850;letter-spacing:.15em;text-transform:uppercase}
    .household-person{min-width:92px;border-left:1px solid #222a27;padding:5px 9px;color:#aeb7b2;font-size:10px;font-weight:800;white-space:nowrap}
    .household-person i{display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;background:#66706b;vertical-align:1px}
    .household-person strong{margin-left:5px;color:#7f8984;font-size:8px;letter-spacing:.09em;text-transform:uppercase}
    .household-person.done i{background:#a9ffcf;box-shadow:0 0 10px rgba(169,255,207,.28)}
    .household-person.done strong{color:#a9ffcf}
    .household-person.ready i{background:#e4ece7}
    .toolbar-group{display:flex;margin-left:10px;padding:3px;border:1px solid #222a27;border-radius:10px;background:#0b0f0e}
    .toolbar button{border:0;border-radius:7px;background:transparent;color:#76807b;padding:7px 10px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
    .toolbar button.active{background:#e8eee9;color:#101411}
    .toolbar button.remote-focus{outline:2px solid #a9ffcf;outline-offset:3px;box-shadow:0 0 18px rgba(169,255,207,.18)}
    .live{display:flex;align-items:center;color:#89938e;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
    .live-dot{width:6px;height:6px;margin-right:7px;border-radius:50%;background:#73e4a4;box-shadow:0 0 12px rgba(115,228,164,.45)}
    .clock{margin-left:14px;color:#d8ddda;font-size:13px;font-weight:700;white-space:nowrap}
    .preview-chip{display:none;margin-left:10px;border:1px solid #39423e;border-radius:999px;padding:5px 8px;color:#aeb7b2;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    .preview-chip.visible{display:block}

    .whoop{flex:0 0 82px;height:82px;display:flex;margin-top:18px;border-top:1px solid #202723;border-bottom:1px solid #202723;background:#0b0f0e}
    .metric{position:relative;min-width:0;flex:1;padding:13px 20px;border-right:1px solid #202723}
    .metric:last-child{border-right:0}
    .metric b{display:block;margin-top:6px;color:#f5f7f4;font-size:25px;font-weight:760;letter-spacing:-.035em;line-height:1}
    .metric.recovery b{color:#a9ffcf}
    .trend{position:absolute;right:18px;bottom:13px;color:#79827e;font-size:9px;font-weight:750}
    .trend.up{color:#76d99b}
    .trend.down{color:#e17d84}
    .status{flex:0 0 82px;height:82px;margin-top:18px;display:flex;align-items:center;border-top:1px solid #202723;border-bottom:1px solid #202723;color:#8b9490;font-size:13px}
    .connect{margin-left:14px;border:1px solid #35413b;border-radius:8px;background:#111714;color:#dfe7e2;padding:8px 12px;font-size:11px;font-weight:800;cursor:pointer}
    .status-copy b{display:block;color:#dfe7e2;font-size:14px}
    .status-copy span{display:block;margin-top:6px;color:#7f8984;font-size:11px}
    .whoop-qr{width:68px;height:68px;margin-right:16px;border:5px solid #fff;border-radius:7px;background:#fff}

    .workspace{flex:1;min-height:0;margin-top:18px;overflow:hidden}
    .view{height:100%;min-height:0;display:flex;flex-direction:column}
    .view-head{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:13px}
    .view-title{margin-top:5px;font-size:38px;font-size:clamp(32px,3vw,48px);font-weight:790;letter-spacing:-.045em;line-height:.95}
    .view-subtitle{margin-top:7px;color:#7f8884;font-size:12px}
    .session-summary{display:flex;align-items:center}
    .summary-item{margin-left:24px;text-align:right}
    .summary-item span{display:block;color:#717a76;font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
    .summary-item b{display:block;margin-top:5px;color:#dfe4e1;font-size:17px;font-weight:740}

    .training-layout{flex:1;min-height:0;display:flex}
    .focus-card{position:relative;width:38%;height:100%;min-height:0;margin-right:14px;overflow:hidden;border:1px solid #29332e;border-radius:18px;background:#111614;background:linear-gradient(145deg,#18201c 0,#101513 54%,#0c100f 100%);padding:25px 27px;display:flex;flex-direction:column}
    .focus-card.remote-focus{border-color:#62796d;box-shadow:inset 0 0 0 1px rgba(169,255,207,.18),0 0 24px rgba(61,119,87,.08)}
    .focus-card:after{content:"";position:absolute;width:230px;height:230px;right:-100px;top:-110px;border:1px solid rgba(169,255,207,.12);border-radius:50%;box-shadow:0 0 70px rgba(85,184,127,.08)}
    .focus-top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center}
    .focus-index{color:#a9ffcf;font-size:11px;font-weight:850;letter-spacing:.14em}
    .focus-state{border:1px solid #33423a;border-radius:999px;padding:5px 8px;color:#8d9c94;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    .focus-name{position:relative;z-index:1;max-width:95%;margin-top:20px;font-size:31px;font-size:clamp(25px,2.35vw,38px);font-weight:770;letter-spacing:-.035em;line-height:1.02}
    .focus-prescription{position:relative;z-index:1;margin-top:11px;color:#929c97;font-size:14px}
    .set-section{position:relative;z-index:1;margin-top:auto}
    .set-readout{display:flex;align-items:flex-end;justify-content:space-between}
    .set-readout strong{font-size:46px;font-size:clamp(36px,3.5vw,56px);letter-spacing:-.06em;line-height:.85}
    .set-readout span{color:#77817c;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    .set-track{display:flex;margin-top:18px}
    .set-segment{height:7px;flex:1;margin-right:7px;border-radius:8px;background:#2b3430}
    .set-segment.done{background:#a9ffcf;box-shadow:0 0 14px rgba(169,255,207,.18)}
    .focus-hint{margin-top:15px;color:#737c78;font-size:10px;font-weight:750;letter-spacing:.06em}
    .focus-middle{position:relative;z-index:1;margin:auto 0;text-align:center}
    .stage-label,.timer-label{color:#75807a;font-size:9px;font-weight:850;letter-spacing:.18em;text-transform:uppercase}
    .stage-value{margin-top:7px;color:#dfe6e2;font-size:38px;font-weight:780;letter-spacing:-.04em}
    .timer-value{margin-top:6px;color:#a9ffcf;font-size:58px;font-size:clamp(46px,4.2vw,68px);font-weight:790;letter-spacing:-.065em;line-height:.9}
    .timer-next{margin-top:10px;color:#828c87;font-size:10px;font-weight:700}
    .timer-track{height:4px;margin:14px auto 0;max-width:220px;overflow:hidden;border-radius:4px;background:#2c3631}
    .timer-track i{display:block;height:100%;background:#a9ffcf}

    .session-list{width:62%;height:100%;min-height:0;display:flex;flex-direction:column}
    .exercise{position:relative;flex:1;min-height:0;display:flex;align-items:center;margin-bottom:7px;border:1px solid #1f2723;border-radius:12px;background:#0c100f;padding:7px 14px;cursor:pointer;overflow:hidden}
    .exercise:last-child{margin-bottom:0}
    .exercise.selected{background:#111714}
    .exercise.remote-focus{border-color:#62796d;background:#141b18;box-shadow:inset 3px 0 0 #a9ffcf,0 0 18px rgba(61,119,87,.08)}
    .exercise.complete{opacity:.66}
    .exercise-num{width:38px;color:#5e6863;font-size:10px;font-weight:850;letter-spacing:.1em}
    .exercise-main{min-width:0;flex:1}
    .exercise-name{overflow:hidden;color:#dce2de;font-size:17px;font-size:clamp(15px,1.25vw,20px);font-weight:700;line-height:1.05;text-overflow:ellipsis;white-space:nowrap}
    .exercise-meta{margin-top:5px;color:#68726d;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
    .set-dots{display:flex;align-items:center;margin-left:14px}
    .set-dot{width:7px;height:7px;margin-left:6px;border:1px solid #4b5650;border-radius:50%;background:transparent}
    .set-dot.done{border-color:#a9ffcf;background:#a9ffcf}
    .set-count{width:48px;margin-left:15px;color:#aeb7b2;font-size:13px;font-weight:800;text-align:right}

    .ambient-layout{flex:1;min-height:0;display:flex}
    .ambient-plan{width:68%;min-height:0;margin-right:14px;display:flex;flex-direction:column;border:1px solid #232c28;border-radius:18px;background:#0c100f;overflow:hidden}
    .ambient-move{position:relative;flex:1;min-height:0;display:flex;align-items:center;padding:8px 18px;border-bottom:1px solid #202824}
    .ambient-move:last-child{border-bottom:0}
    .ambient-move:before{content:"";position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:0 4px 4px 0;background:#334039}
    .ambient-move.complete:before{background:#a9ffcf;box-shadow:0 0 14px rgba(169,255,207,.22)}
    .ambient-move.complete{opacity:.72}
    .ambient-number{flex:0 0 44px;color:#66716b;font-size:10px;font-weight:850;letter-spacing:.12em}
    .ambient-name{min-width:0;flex:1;color:#edf1ee;font-size:18px;font-size:clamp(15px,1.35vw,21px);font-weight:730;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ambient-prescription{flex:0 0 auto;margin-left:18px;color:#87918c;font-size:11px;font-weight:750;letter-spacing:.04em}
    .ambient-check{flex:0 0 32px;margin-left:18px;color:#a9ffcf;font-size:18px;text-align:right}
    .ambient-panel{position:relative;width:32%;min-height:0;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;border:1px solid #2a3530;border-radius:18px;background:linear-gradient(150deg,#18211d 0,#101613 55%,#0c100f 100%);padding:24px}
    .ambient-panel:after{content:"";position:absolute;right:-80px;top:-100px;width:220px;height:220px;border:1px solid rgba(169,255,207,.12);border-radius:50%;box-shadow:0 0 70px rgba(85,184,127,.08)}
    .ambient-panel.complete{border-color:#436b57;background:linear-gradient(150deg,#193025 0,#111b16 58%,#0c100f 100%)}
    .ambient-status{position:relative;z-index:1}
    .ambient-eyebrow{color:#7f8a84;font-size:9px;font-weight:850;letter-spacing:.18em;text-transform:uppercase}
    .ambient-state{max-width:360px;margin-top:10px;color:#f1f5f2;font-size:31px;font-size:clamp(25px,2.35vw,37px);font-weight:790;letter-spacing:-.05em;line-height:.95}
    .ambient-state.done{color:#a9ffcf}
    .ambient-copy{max-width:350px;margin-top:12px;color:#8b9590;font-size:11px;line-height:1.45}
    .ambient-source{margin-top:11px;color:#a9ffcf;font-size:10px;font-weight:780;letter-spacing:.08em;text-transform:uppercase}
    .ambient-actions{position:relative;z-index:1}
    .ambient-action{width:100%;display:flex;align-items:center;justify-content:space-between;margin-top:8px;border:1px solid #35423c;border-radius:11px;background:#121a16;color:#dbe3de;padding:12px 14px;font-size:10px;font-weight:850;letter-spacing:.11em;text-transform:uppercase;cursor:pointer;text-align:left}
    .ambient-action.primary{border-color:#a9ffcf;background:#a9ffcf;color:#0b110e}
    .ambient-action.remote-focus{outline:3px solid #f3fff8;outline-offset:3px;box-shadow:0 0 25px rgba(169,255,207,.24)}
    .ambient-action span{font-size:17px;font-weight:500}
    .ambient-auto{margin-top:10px;color:#65706a;font-size:9px;font-weight:700;line-height:1.35}

    .rest-layout{flex:1;min-height:0;display:flex}
    .rest-hero{width:40%;height:100%;margin-right:14px;border:1px solid #26302b;border-radius:18px;background:#101513;padding:26px 28px;display:flex;flex-direction:column;justify-content:space-between}
    .rest-word{font-size:68px;font-size:clamp(52px,5vw,82px);font-weight:800;letter-spacing:-.065em;line-height:.84}
    .rest-copy{max-width:420px;margin-top:14px;color:#8d9692;font-size:14px;line-height:1.45}
    .readiness{display:flex;align-items:center;border-top:1px solid #29312e;padding-top:18px}
    .readiness-score{color:#a9ffcf;font-size:32px;font-weight:780;letter-spacing:-.04em}
    .readiness-copy{margin-left:14px}
    .readiness-copy b{display:block;color:#dce2de;font-size:13px}
    .readiness-copy span{display:block;margin-top:4px;color:#747d79;font-size:10px}
    .rest-side{width:60%;height:100%;min-height:0;display:flex;flex-direction:column}
    .next-card{flex:1;min-height:0;border:1px solid #29342e;border-radius:18px;background:#121815;padding:22px 24px;display:flex;align-items:center;justify-content:space-between}
    .next-day{margin-top:8px;color:#a9ffcf;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    .next-name{margin-top:8px;font-size:31px;font-size:clamp(26px,2.4vw,38px);font-weight:760;letter-spacing:-.035em}
    .next-meta{display:flex;margin-top:14px}
    .next-meta span{margin-right:18px;color:#7b8580;font-size:10px;font-weight:750;text-transform:uppercase}
    .next-arrow{color:#a9ffcf;font-size:42px;font-weight:300}
    .recovery-card{flex:0 0 auto;margin-top:12px;border:1px solid #212924;border-radius:14px;background:#0c100f;padding:15px 18px}
    .recovery-line{display:flex;align-items:center;justify-content:space-between}
    .recovery-line strong{font-size:13px}
    .recovery-actions{color:#7f8984;font-size:11px}

    .week-strip{flex:0 0 72px;display:flex;margin-top:12px}
    .week-day{position:relative;flex:1;margin-right:7px;border:1px solid #202824;border-radius:11px;background:#0b0f0e;padding:11px 12px;cursor:pointer}
    .week-day:last-child{margin-right:0}
    .week-day.selected{border-color:#55675e;background:#141a17}
    .week-day.remote-focus{outline:2px solid #a9ffcf;outline-offset:2px}
    .week-day.training:after{content:"";position:absolute;right:10px;top:10px;width:5px;height:5px;border-radius:50%;background:#a9ffcf}
    .week-day span{display:block;color:#66706b;font-size:9px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}
    .week-day b{display:block;margin-top:8px;color:#cbd2ce;font-size:12px}
    .week-day.selected b{color:#fff}

    .household-whoop .household-metric{padding-left:26px}
    .household-metric:before{content:"";position:absolute;left:13px;top:15px;bottom:15px;width:3px;border-radius:3px;background:#65d995}
    .household-metric.kelsey:before{background:#a991ff}
    .metric-person{display:block;color:#dce3df;font-size:9px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}
    .household-metric .metric-label{display:block;margin-top:4px;font-size:8px}
    .household-metric b{margin-top:4px}
    .progress-head{margin-bottom:10px}
    .household-progress-layout{flex:1;min-height:0;display:flex}
    .person-progress{position:relative;flex:0 0 21%;min-width:0;overflow:hidden;border:1px solid #25302a;border-radius:16px;background:#0d1210;padding:16px;display:flex;flex-direction:column}
    .person-progress:after{content:"";position:absolute;right:-65px;top:-72px;width:145px;height:145px;border:1px solid rgba(101,217,149,.11);border-radius:50%}
    .jordan-progress{margin-right:12px}
    .kelsey-progress{margin-left:12px}
    .kelsey-progress:after{border-color:rgba(169,145,255,.14)}
    .person-progress-head{position:relative;z-index:1;display:flex;align-items:center}
    .person-avatar{flex:0 0 35px;width:35px;height:35px;margin-right:10px;border:1px solid #4b725e;border-radius:50%;background:#16231c;color:#a9ffcf;font-size:14px;font-weight:850;line-height:33px;text-align:center}
    .kelsey-progress .person-avatar{border-color:#63558d;background:#211b31;color:#c1afff}
    .person-progress-head span,.person-recovery span,.person-stat-grid span,.person-streak span,.person-latest span{display:block;color:#6f7974;font-size:8px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}
    .person-progress-head strong{display:block;margin-top:4px;color:#eef2ef;font-size:16px}
    .person-recovery{position:relative;z-index:1;margin-top:13px;border-top:1px solid #242d29;border-bottom:1px solid #242d29;padding:11px 0}
    .person-recovery strong{display:inline-block;margin-top:4px;color:#a9ffcf;font-size:30px;font-weight:790;letter-spacing:-.055em;line-height:1}
    .kelsey-progress .person-recovery strong{color:#c1afff}
    .person-recovery small{float:right;margin-top:15px;color:#818b86;font-size:9px;font-weight:750}
    .person-stat-grid{display:flex;margin-top:11px}
    .person-stat-grid>div{width:50%}
    .person-stat-grid>div+div{border-left:1px solid #242d29;padding-left:11px}
    .person-stat-grid strong{display:block;margin-top:6px;color:#e4e9e6;font-size:20px;letter-spacing:-.04em}
    .person-stat-grid strong small{color:#68736d;font-size:11px}
    .person-streak{display:flex;align-items:baseline;margin-top:12px;border-radius:10px;background:#111814;padding:10px 11px}
    .person-streak span{flex:1}
    .person-streak strong{color:#eef2ef;font-size:22px}
    .person-streak small{margin-left:4px;color:#6f7974;font-size:8px;font-weight:800;text-transform:uppercase}
    .person-latest{min-height:0;margin-top:auto;border-top:1px solid #242d29;padding-top:11px}
    .person-latest strong{display:block;margin-top:6px;overflow:hidden;color:#dce2de;font-size:12px;text-overflow:ellipsis;white-space:nowrap}
    .person-latest small{display:block;margin-top:5px;color:#707a75;font-size:9px}
    .calendar-panel{flex:1;min-width:0;min-height:0;border:1px solid #29332e;border-radius:16px;background:#0c100f;padding:13px 14px 10px;display:flex;flex-direction:column}
    .calendar-head{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
    .calendar-head span{display:block;color:#707a75;font-size:8px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}
    .calendar-head strong{display:block;margin-top:3px;font-size:19px;letter-spacing:.02em}
    .calendar-key{color:#6d7772;font-size:7px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
    .calendar-key i{display:inline-block;width:6px;height:6px;margin:0 4px 0 8px;border-radius:50%;background:#171d1a}
    .calendar-key i.done{background:#65d995}
    .calendar-key i.pushed{background:#8064d9}
    .calendar-key i.scheduled{background:#292e2b}
    .calendar-key i.missed{background:#713a43}
    .month-grid{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-content:stretch}
    .calendar-weekday{width:14.285%;height:9%;display:flex;align-items:center;justify-content:center;color:#66706b;font-size:8px;font-weight:850;letter-spacing:.12em}
    .calendar-day{position:relative;width:14.285%;height:15.166%;border-top:2px solid #0c100f;border-right:2px solid #0c100f;overflow:hidden}
    .calendar-day.filled{box-shadow:inset 0 0 0 1px rgba(255,255,255,.025)}
    .calendar-day.today{box-shadow:inset 0 0 0 2px #e9f0ec}
    .calendar-day b{position:absolute;z-index:2;left:50%;top:50%;color:#e1e7e3;font-size:10px;font-weight:850;transform:translate(-50%,-50%);text-shadow:0 1px 4px rgba(0,0,0,.8)}
    .calendar-initial{position:absolute;z-index:2;color:rgba(255,255,255,.72);font-size:6px;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.8)}
    .jordan-initial{left:5px;top:4px}
    .kelsey-initial{right:5px;bottom:4px}
    .empty-day{background:#0a0e0c}
    .calendar-foot{flex:0 0 auto;display:flex;justify-content:space-between;margin-top:6px;color:#5e6963;font-size:7px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .calendar-foot b{color:#dfe6e2}

    .footerbar{flex:0 0 28px;display:flex;align-items:flex-end;justify-content:space-between;margin-top:10px}
    .control-hint{color:#59635e;font-size:9px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
    .key{display:inline-block;margin:0 4px;border:1px solid #303a35;border-radius:5px;padding:3px 6px;color:#98a29d}
    .day-nav{display:flex}
    .day-nav button{margin-left:5px;border:1px solid #27312c;border-radius:7px;background:#0d1210;color:#7f8984;padding:6px 9px;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
    .day-nav button.today{color:#dfe6e2;border-color:#3b4942}
    .toast{position:fixed;z-index:20;left:50%;bottom:48px;display:none;min-width:280px;padding:11px 16px;border:1px solid #46564e;border-radius:999px;background:#121915;color:#dfe7e2;font-size:10px;font-weight:850;letter-spacing:.1em;text-align:center;text-transform:uppercase;transform:translateX(-50%);box-shadow:0 12px 40px rgba(0,0,0,.45)}
    .toast.visible{display:block}
    .celebration{position:fixed;z-index:100;top:0;right:0;bottom:0;left:0;display:none;align-items:center;justify-content:center;background:#07100b;background:radial-gradient(circle at 50% 40%,#254a35 0,#10241a 34%,#070b09 72%);text-align:center;cursor:pointer}
    .celebration.visible{display:flex}
    .celebration-inner{position:relative;padding:40px}
    .celebration-mark{width:76px;height:76px;margin:0 auto 26px;border:2px solid #a9ffcf;border-radius:50%;color:#a9ffcf;font-size:42px;line-height:70px;box-shadow:0 0 55px rgba(169,255,207,.2)}
    .celebration-kicker{color:#a9ffcf;font-size:11px;font-weight:850;letter-spacing:.28em;text-transform:uppercase}
    .celebration-title{margin-top:14px;color:#f3f7f4;font-size:70px;font-size:clamp(50px,6vw,92px);font-weight:820;letter-spacing:-.07em;line-height:.86}
    .celebration-meta{margin-top:22px;color:#9da8a2;font-size:15px;font-weight:650}
    .celebration-dismiss{margin-top:35px;color:#617068;font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}

    @media(max-height:760px) and (min-width:901px){
      body{padding:20px 30px}
      .welcome{font-size:29px}
      .dayline{margin-top:5px;font-size:13px}
      .whoop,.status{height:70px;flex-basis:70px;margin-top:12px}
      .metric{padding:10px 16px}
      .metric b{font-size:21px}
      .trend{right:14px;bottom:9px}
      .workspace{margin-top:12px}
      .view-head{margin-bottom:9px}
      .view-title{font-size:31px}
      .view-subtitle{margin-top:4px}
      .focus-card{padding:18px 22px}
      .focus-name{margin-top:12px;font-size:26px}
      .focus-prescription{margin-top:7px;font-size:12px}
      .set-track{margin-top:10px}
      .focus-hint{margin-top:9px}
      .exercise{margin-bottom:5px}
      .ambient-panel{padding:18px}
      .ambient-state{margin-top:7px;font-size:27px}
      .ambient-copy{margin-top:8px}
      .ambient-action{padding:9px 12px}
      .footerbar{margin-top:6px}
    }

    @media(max-width:900px){
      html,body{height:auto;overflow:auto}
      body{height:auto;min-height:100vh;padding:20px}
      .screen{height:auto;min-height:100vh}
      .topbar,.training-layout,.ambient-layout,.rest-layout,.household-progress-layout{display:block}
      .toolbar{margin-top:16px;justify-content:flex-start;flex-wrap:wrap}
      .household{width:100%;margin:0 0 8px}
      .toolbar-group{margin:8px 8px 0 0}
      .whoop{height:auto;flex-wrap:wrap}
      .metric{min-width:50%;border-bottom:1px solid #202723}
      .workspace{overflow:visible}
      .focus-card,.session-list,.rest-hero,.rest-side,.person-progress,.calendar-panel{width:100%;height:auto}
      .ambient-plan,.ambient-panel{width:100%;height:auto}
      .ambient-plan{margin-right:0;margin-bottom:12px}
      .ambient-move{min-height:56px}
      .focus-card,.rest-hero,.person-progress,.calendar-panel{margin:0 0 12px}
      .person-progress{min-height:300px}
      .month-grid{height:430px;flex:none}
      .focus-card{min-height:330px}
      .exercise{min-height:64px}
      .week-strip{overflow:auto}
      .week-day{min-width:105px}
      .footerbar{margin-top:18px}
    }
  </style>
</head>
<body>
  <main class="screen">
    <header class="topbar">
      <div class="identity">
        <div class="kicker">Shop Training <strong id="planName">Live</strong></div>
        <div class="welcome" id="hello">HELLO</div>
        <div class="dayline" id="date"></div>
      </div>
      <div class="toolbar">
        <div class="household" id="householdStatus"></div>
        <div class="live"><i class="live-dot"></i><span id="whoopLive">WHOOP LIVE</span></div>
        <div class="clock" id="clock"></div>
        <div class="preview-chip" id="preview">Preview</div>
        <div class="toolbar-group">
          <button id="jordanBtn" onclick="setProfile('jordan')">Jordan</button>
          <button id="kelseyBtn" onclick="setProfile('kelsey')">Kelsey</button>
        </div>
        <div class="toolbar-group">
          <button id="todayTab" class="active" onclick="setView('today')">Session</button>
          <button id="progressTab" onclick="setView('progress')">Progress</button>
        </div>
      </div>
    </header>

    <section id="whoop" class="status">Loading WHOOP…</section>
    <section class="workspace" id="content"></section>

    <footer class="footerbar">
      <div class="control-hint" id="controlHint"><span class="key">↑ ↓</span> Select <span class="key">Enter</span> Complete set</div>
      <div class="day-nav">
        <button onclick="changeDay(-1)">‹ Day</button>
        <button class="today" onclick="useToday()">Today</button>
        <button onclick="changeDay(1)">Day ›</button>
      </div>
    </footer>
  </main>
  <div class="toast" id="toast"></div>
  <div class="celebration" id="celebration" onclick="dismissCelebration()">
    <div class="celebration-inner">
      <div class="celebration-mark">✓</div>
      <div class="celebration-kicker" id="celebrationSource">Workout complete</div>
      <div class="celebration-title" id="celebrationTitle">SESSION COMPLETE</div>
      <div class="celebration-meta" id="celebrationMeta"></div>
      <div class="celebration-dismiss">Press Enter to return · dashboard returns automatically</div>
    </div>
  </div>
  <script src="/app-legacy.js"></script>
</body>
</html>
